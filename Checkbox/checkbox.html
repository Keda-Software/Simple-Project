<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CheckBox</title>
</head>
<div>
<style>
*{
  margin: 0;
}
  body{
   font-family: verdana;
   font-size: 24px;
   color: #f10c0c;
   font-family: cambria;
   background-color: #4d800b3f;
   display:flex;
   justify-content: center;
   align-items: center;
   height: 100vh;
  }
  .container{
    background-color: aliceblue;
    padding:20px;
    border-radius: 14px;
    box-shadow: 5px 2px 16px rgb(0,0,0,0.8);

  }
  #mysubmit{
    font-size: 1em;
  }
  #mySubmit{
        background-color:rgb(31, 156, 156);
        border-radius: 7px;
        padding:5px;
        font-size: 18px;
        margin:6px;
  }
  h1{
    padding: 5px;
    background-color: #181010c0;
    border-radius: 10px;
    font-size: 35x;
  }
  .result{
    background-color: #444;
    color:white;
    padding:10px;
    border-radius: 20px;
    text-align:center;
  }

</style>
<div class="container">
<h1>Checkbox and Radio Project</h1>
<input type="checkbox" id="myCheckbox">
<label for="myCheckbox">Subscribe</label><br>
<input type="radio" id="visaBtn" name="card">
<label for="visaBtn">Visa</label><br>
<input type="radio" id="masterCardBtn" name="card">
<label for="masterCard">MasterCard</label><br>
<input type="radio" id="payPalBtn" name="card">
<label for="payPalBtn">PayPal</label><br>

<button type="submit" id="mySubmit">Submit</button>
<div class="result">
<p id="subResult"> </p>
<p id="paymentResult"> </p>
</div>
</div>
<script src="checkbox.js"></script>
</body>
</html>
