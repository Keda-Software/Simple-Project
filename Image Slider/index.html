
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Slider</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="slider-container">
    <div class="image-container">
      <img src="https://picsum.photos/id/1/500/300" alt="Image 1">
      <img src="https://picsum.photos/id/23/500/300" alt="Image 2">
      <img src="https://picsum.photos/id/37/500/300" alt="Image 3">
      <img src="https://picsum.photos/id/87/500/300" alt="Image 4">
      <img src="https://picsum.photos/id/20/500/300" alt="Image 5">
    </div>

    <button class="btn prev" id="prev">❮</button>
    <button class="btn next" id="next">❯</button>

    <div class="counter" id="counter">1 / 5</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
