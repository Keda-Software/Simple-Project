
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Payslip</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #0002;
        }

        h1, h2 {
            text-align: center;
            color: #173b65;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #173b65;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #24578e;
        }

        #payslip {
            display: none;
            margin-top: 25px;
            padding: 15px;
            border: 2px dashed #173b65;
            border-radius: 8px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .total {
            font-size: 18px;
            font-weight: bold;
            color: #138044;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Employee Payslip</h1>

    <form id="salaryForm">
        <label for="name">Employee Name</label>
        <input type="text" id="name" required>

        <label for="basic">Basic Salary</label>
        <input type="number" id="basic" min="0" step="0.01" required>

        <label for="transport">Transport Allowance</label>
        <input type="number" id="transport" min="0" step="0.01" required>

        <label for="food">Food Allowance</label>
        <input type="number" id="food" min="0" step="0.01" required>

        <button type="submit">Generate Payslip</button>
    </form>

    <div id="payslip">
        <h2>PAYSLIP</h2>
        <p><strong>Employee:</strong> <span id="employeeName"></span></p>
        <hr>

        <div class="row">
            <span>Basic Salary</span>
            <span id="basicResult"></span>
        </div>

        <div class="row">
            <span>Transport Allowance</span>
            <span id="transportResult"></span>
        </div>

        <div class="row">
            <span>Food Allowance</span>
            <span id="foodResult"></span>
        </div>

        <div class="row total">
            <span>Gross Salary</span>
            <span id="grossResult"></span>
        </div>

        <button type="button" onclick="window.print()">
            Print Payslip
        </button>
    </div>
</div>

<script>
    const form = document.getElementById("salaryForm");

    form.addEventListener("submit", function(event) {
        event.preventDefault();

        // Get employee information
        const name = document.getElementById("name").value.trim();
        const basic = Number(document.getElementById("basic").value);
        const transport = Number(document.getElementById("transport").value);
        const food = Number(document.getElementById("food").value);

        // Calculate gross salary
        const gross = basic + transport + food;

        // Format salary values
        const formatMoney = amount =>
            amount.toLocaleString("en-US", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });

        // Display payslip information
        document.getElementById("employeeName").textContent = name;
        document.getElementById("basicResult").textContent = formatMoney(basic);
        document.getElementById("transportResult").textContent = formatMoney(transport);
        document.getElementById("foodResult").textContent = formatMoney(food);
        document.getElementById("grossResult").textContent = formatMoney(gross);

        // Show the payslip
        document.getElementById("payslip").style.display = "block";
    });
</script>

</body>
</html>
